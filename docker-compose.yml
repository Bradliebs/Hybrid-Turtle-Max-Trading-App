# DEPENDENCIES
# Consumed by: docs/DEPLOYMENT.md
# Consumes: Dockerfile, .env, services/model-service/Dockerfile
# Risk-sensitive: NO
# Last modified: 2026-09-26
# Notes: Stable local runtime uses the existing SQLite-backed app container.
#        The Postgres service is provided as a scaffold for future provider migration work.
#        Scheduled jobs (nightly stops, midday sync, auto-trade) are Windows Task
#        Scheduler tasks and do not run in this container. See docs/DEPLOYMENT.md.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: http://localhost:3000
      DATABASE_URL: ${DATABASE_URL:-file:./dev.db}
      MODEL_SERVICE_URL: ${MODEL_SERVICE_URL:-http://model-service:8000}
      # Desktop mode, same as start.bat: single user, no login. Safe only because
      # the port below is published on the host's 127.0.0.1. To expose the app on
      # your network, set this to 'false' AND change the port to '3000:3000'.
      DISABLE_API_AUTH: 'true'
      # 'disabled' matches the desktop installer. Trading 212 sync uses the app's
      # own Trading 212 connection (Settings > Broker), not this adapter. 'mock'
      # feeds the workflow a simulated broker and must not be used with real accounts.
      BROKER_ADAPTER: ${BROKER_ADAPTER:-disabled}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./prisma:/app/prisma
      - ./reports:/app/reports
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/heartbeat').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  model-service:
    build:
      context: ./services/model-service
      dockerfile: Dockerfile
    profiles: ['model']
    ports:
      - '8000:8000'
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ['postgres']
    environment:
      POSTGRES_DB: hybridturtle
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trader -d hybridturtle']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: